  <script>
    (function () {
      var VER = "56";

      async function clearOldCaches() {
        try {
          if (!window.caches) return;
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) {
            return k.indexOf("japan2026-offline-") === 0 && k !== "japan2026-offline-v56"
              ? caches.delete(k)
              : Promise.resolve();
          }));
        } catch (e) {}
      }

      function registerSW() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js?v=" + VER).catch(function () {});
        }
      }

      var btn = document.getElementById("forceRefresh");
      if (btn) {
        btn.addEventListener("click", function () {
          clearOldCaches().then(function () {
            var url = new URL(location.href);
            url.searchParams.set("v", VER);
            url.searchParams.set("fresh", String(Date.now()));
            location.replace(url.toString());
          });
        });
      }

      clearOldCaches().then(registerSW);
    })();
  </script>
